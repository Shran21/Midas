[workspace]
members = [
  "server",
  "shared/protocol",
  "agent/agent-core",
  "agent/agent-windows/media-prototype",
  "agent/agent-windows/uac-prototype",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/Shran21/Midas"
publish = false

[workspace.dependencies]
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"
totp-rs = { version = "6", default-features = false, features = ["std", "otpauth", "zeroize"] }
webauthn-rs = { version = "=0.5.5", default-features = false }
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }
webauthn-rs-proto = "=0.5.5"
openssl = { version = "0.10", features = ["vendored"] }
zeroize = { version = "1", features = ["derive"] }
axum = { version = "0.8.9", features = ["ws"] }
tokio-tungstenite = "0.29"
prost = "0.14"
time = "0.3"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "webpki-roots", "axum"] }
futures-util = "0.3"
rcgen = "0.14.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "time"] }
tower = { version = "0.5", features = ["util"] }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
ldap3_proto = "0.9.0"
tokio-util = { version = "0.7.20", features = ["codec"] }
str0m = { version = "0.25.0", default-features = false, features = ["rust-crypto"] }
openh264 = "0.9.9"
win_desktop_duplication = "0.10.11"
windows-capture = "2.0.1"
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Full debug info for every dependency made the debug build grow past 30 GB on Windows;
# line tables keep file and line numbers in our own backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "debuginfo"
