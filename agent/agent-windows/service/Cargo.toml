[package]
name = "midas-agent-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "midas-agent"
path = "src/main.rs"

# Win32 calls need unsafe code: denied here, allowed only inside the reviewed `win` module.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
undocumented_unsafe_blocks = "warn"

[dependencies]
clap.workspace = true
midas-agent-core = { path = "../../agent-core", version = "0.1.0" }
midas-protocol = { path = "../../../shared/protocol", version = "0.1.0" }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
windows-sys.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
