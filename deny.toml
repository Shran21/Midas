[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
include-dev = true
allow = ["AGPL-3.0-only", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "CDLA-Permissive-2.0", "ISC", "MIT", "MPL-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.95

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
